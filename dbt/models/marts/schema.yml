version: 2

models:
  - name: stg_sales
    description: Typed and deduplicated order lines from the raw landing zone
    columns:
      - name: order_id
        description: Order identifier
        tests:
          - not_null
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null
      - name: amount
        description: Extended order amount
        tests:
          - not_null
          - column_values_to_be_between:
              min_value: 0
      - name: customer_id
        tests:
          - not_null

  - name: stg_products
    description: Cleaned product dimension
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_name
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: sales_daily
    description: Daily sales aggregates consumed by the API and BI dashboards
    columns:
      - name: sales_date
        description: Calendar day of the aggregate
        tests:
          - not_null
          - unique
      - name: order_count
        description: Distinct completed orders on that day
        tests:
          - not_null
      - name: total_amount
        description: Sum of completed order amounts
        tests:
          - not_null
          - column_values_to_be_between:
              min_value: 0
