dataair:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dataair') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dataair') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dataair') }}"
      schema: public
      threads: 4
      connect_timeout: 10
      keepalives_idle: 0
      role: "{{ env_var('DBT_ROLE', '') }}"
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dataair') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dataair') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dataair') }}"
      schema: public
      threads: 8
      connect_timeout: 10
      keepalives_idle: 0
