global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: dataair

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: dataair-backend

  - job_name: celery-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: dataair-worker

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9100"]
        labels:
          service: dataair-scheduler

  - job_name: flower
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: dataair-flower

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: dataair-postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: dataair-redis
