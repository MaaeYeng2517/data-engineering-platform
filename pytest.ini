[pytest]
testpaths = tests
# The suite imports `backend.*`, which only resolves when the repository root is
# importable. Without this, `pytest` inserts `tests/` instead and collection fails
# with ModuleNotFoundError both on the host and inside the backend container.
pythonpath = .
# tests/test_platform.py is written as a script with plain `async def` tests, so
# pytest has to drive the event loop itself. pytest-asyncio's auto mode runs those
# and leaves `python tests/test_platform.py` working as before.
asyncio_mode = auto
