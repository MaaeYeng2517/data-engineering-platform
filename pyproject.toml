[project]
name = "dataair-backend"
version = "1.0.0"
description = "Knowledge Engineering Platform API"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web layer. `standard` pulls uvicorn, python-multipart, email-validator,
    # httpx and jinja2, all of which the API imports at request time.
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "starlette>=0.41",
    # Persistence. asyncpg is required by backend/database.py at import time.
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "aiofiles>=23.2",
    # Auth. bcrypt and PyJWT back the login and API-key paths.
    "pyjwt>=2.8",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=42",
    # Platform services.
    "redis>=5.0",
    "celery>=5.3",
    "boto3>=1.34",
    "httpx>=0.26",
    "requests>=2.31",
    "elasticsearch>=8.12",
    "qdrant-client>=1.7",
    # Observability.
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp-proto-http>=1.21",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    # Integrations.
    "openai>=1.12",
    "anthropic>=0.18",
    "stripe>=8.0",
    # Imported by the retrieval and graph helpers.
    "numpy>=1.26",
    "networkx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# The app instance lives in backend/main.py, which is outside the locations
# FastAPI Cloud auto-detects, so the entrypoint is declared explicitly.
[tool.fastapi]
entrypoint = "backend.main:app"